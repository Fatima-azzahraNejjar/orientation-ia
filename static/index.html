<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Orientation IA - Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth-container">
    <div id="login-form">
        <h3>Connexion</h3>
        <input type="text" id="login-username" placeholder="Pseudo">
        <input type="password" id="login-password" placeholder="Mot de passe">
        <button onclick="login()">Se connecter</button>
    </div>
    <hr>
    <div id="register-form">
        <h3>Créer un compte</h3>
        <input type="text" id="reg-username" placeholder="Pseudo">
        <input type="password" id="reg-password" placeholder="Mot de passe">
        <button onclick="register()">S'inscrire</button>
    </div>
</div>

<div id="chat-interface" style="display:none;">
</div>

    <div class="chat-container">
        <header>
            <h1>Orientation IA </h1>
            <p>Posez vos questions sur les licences, bourses et métiers.</p>
        </header>

        <div id="chat-box" class="chat-box">
            <div class="bot-msg">Bonjour ! Je suis votre conseiller. Comment puis-je vous aider ?</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ex: Licence de Lettres à la Sorbonne...">
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
